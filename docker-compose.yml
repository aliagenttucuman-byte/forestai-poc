services:
  backend:
    build: ./backend
    ports:
      - "8010:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - sam_models:/tmp/sam_models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-net
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build: ./frontend
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - app-net

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: forestai
      POSTGRES_PASSWORD: forestai2026
      POSTGRES_DB: forestai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - app-net

volumes:
  pgdata:
  uploads_data:
  sam_models:

networks:
  app-net:
    driver: bridge
